<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toy chest studio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toy chest">
<meta name="theme-color" content="#EEF3FF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Pacifico&family=Bungee&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FF;--panel:#FFFFFF;--ink:#1F2A44;--muted:#56617E;--line:#D3DBEE;
  --accent:#FFC93C;--accent-ink:#4A3300;--grape:#6A3FC8;--stage:#DCE6FF;--floor:#D9C4A2;--danger:#C62839;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141A2B;--panel:#1E2640;--ink:#EEF2FF;--muted:#A9B3CF;--line:#343E5E;--stage:#27314F;--floor:#6B5840;--grape:#B69CFF;--danger:#FF7A85}
}
:root[data-theme="dark"]{--bg:#141A2B;--panel:#1E2640;--ink:#EEF2FF;--muted:#A9B3CF;--line:#343E5E;--stage:#27314F;--floor:#6B5840;--grape:#B69CFF;--danger:#FF7A85}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:clamp(30px,5vw,44px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-0.5px}
.sub{margin:4px 0 0;color:var(--muted);font-size:18px}
.hbtns{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;color:inherit;cursor:pointer}
.big{border:2px solid var(--ink);background:var(--panel);border-radius:14px;padding:8px 16px;font-size:17px;font-weight:700}
.big.yellow{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}
.big.grape{background:var(--grape);color:#fff;border-color:var(--grape)}
.savebar{display:none;background:var(--panel);border:2px solid var(--accent-ink);border-radius:20px;padding:12px 14px;margin-bottom:14px;gap:10px;flex-wrap:wrap;align-items:center}
.savebar.open{display:flex}
.savebar label{font-weight:800;font-size:18px}
.savebar input{flex:1 1 200px;min-width:0}
.msg{min-height:1.4em;margin:0 0 10px;font-weight:700;color:var(--grape)}
.msg.err{color:var(--danger)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.stage{background:var(--stage);border-radius:24px;padding:14px 14px 8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:820px){.stage{position:static}}
#chest{width:100%;max-height:70vh;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{text-align:center;color:var(--muted);font-size:15px;margin:6px 0 2px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:16px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tool{border:2px solid var(--line);background:transparent;border-radius:16px;padding:10px 6px;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tool span{font-size:24px;line-height:1}
.tool[aria-pressed="true"]{background:var(--grape);border-color:var(--grape);color:#fff}
h2{font-size:20px;margin:14px 0 8px;font-weight:800}
h2:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:16px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-ink);color:var(--accent-ink)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px}
.sw{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px;font-size:14px;font-weight:600;color:var(--muted)}
.dot{width:50px;height:50px;border-radius:50%;border:2px solid rgba(0,0,0,.18);display:block}
.sw[aria-pressed="true"] .dot{outline:4px solid var(--accent);outline-offset:2px}
.sw[aria-pressed="true"]{color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:transparent;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--grape);box-shadow:0 0 0 2px var(--grape) inset}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.st{font-size:32px;border:2px solid var(--line);background:transparent;border-radius:14px;padding:4px 0;line-height:1.2}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=text]{font-family:inherit;font-size:22px;font-weight:700;width:100%;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.note{color:var(--muted);font-size:15px;margin:10px 0 0}
.gallery{margin-top:28px}
.gallery-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.gallery-head h2{font-size:clamp(24px,4vw,32px);margin:0}
.gallery-head p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card.current{border-color:var(--grape);box-shadow:0 0 0 2px var(--grape) inset}
.thumb{border:none;background:var(--stage);border-radius:14px;padding:6px;display:block;width:100%}
.thumb svg{width:100%;height:auto;display:block}
.cname{font-weight:800;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.cdate{color:var(--muted);font-size:14px}
.cdate.pend{color:var(--grape);font-weight:700}
.cbtns{display:flex;gap:6px;margin-top:auto}
.cbtns button{flex:1;border:2px solid var(--line);background:transparent;border-radius:12px;padding:4px 6px;font-size:15px;font-weight:700}
.cbtns .open{background:var(--accent);border-color:var(--accent-ink);color:var(--accent-ink)}
.cbtns .del.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.empty{background:var(--panel);border:2px dashed var(--line);border-radius:20px;padding:24px;text-align:center;color:var(--muted);font-size:18px}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.sel{stroke-dasharray:7 5}
@media (prefers-reduced-motion: no-preference){
  .sel{animation:march 1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-24}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>My toy chest studio</h1>
      <p class="sub">Tap a part of the chest, then pick how it looks. Add your name with the My name button.</p>
    </div>
    <div class="hbtns">
      <button class="big grape" id="saveOpen">Save design</button>
      <button class="big yellow" id="surprise">Surprise me</button>
      <button class="big" id="reset">Start over</button>
    </div>
  </header>
  <div class="savebar" id="savebar">
    <label for="saveName">Name it:</label>
    <input type="text" id="saveName" maxlength="30">
    <button class="big grape" id="saveNew">Save as new</button>
    <button class="big" id="saveUpdate" hidden>Save over it</button>
    <button class="big" id="saveCancel">Cancel</button>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <div class="grid">
    <div class="stage">
      <svg id="chest" viewBox="0 0 340 412" role="img" aria-label="Your toy chest design"></svg>
      <p class="hint">Drag stickers and your name to move them around.</p>
    </div>
    <div class="panel">
      <div class="tools" id="tools"></div>
      <div id="options"></div>
    </div>
  </div>
  <section class="gallery" aria-labelledby="galTitle">
    <div class="gallery-head">
      <h2 id="galTitle">My saved designs</h2>
      <p id="galCount"></p>
    </div>
    <div id="cards"></div>
  </section>
</div>
<script>
const PAINT=[["Cotton","#FAFAF7"],["Sky","#7CC6FE"],["Ocean","#2E6FD8"],["Mint","#8EE3C8"],["Grass","#4CAF50"],["Sunshine","#FFD23F"],["Tangerine","#FF9F43"],["Cherry","#E63946"],["Bubblegum","#FF8FC7"],["Lavender","#B69CFF"],["Grape","#6A3FC8"],["Midnight","#1F2A44"],["Stone","#9AA3AE"],["Blush","#FFD6E0"]];
const STAINS={natural:["Natural","#E9C99A"],honey:["Honey","#D69A4E"],oak:["Oak","#B97A3C"],walnut:["Walnut","#6B4226"],espresso:["Espresso","#3E2A1E"],whitewash:["Whitewash","#EDE6DA"]};
const PATTERNS=[["none","Plain"],["stripes","Stripes"],["dots","Polka dots"],["checks","Checks"],["hearts","Hearts"],["stars","Stars"]];
const PARTS=[["drawer","Drawer"],["top","Top"],["frame","Frame"],["binL","Left bin"],["binR","Right bin"],["inside","Inside"],["lip","Shoe lip"],["kick","Bottom trim"],["all","Everything"]];
const HSTYLES=[["bar","Bar"],["knobs","Two knobs"],["star","Star"],["heart","Heart"],["flower","Flower"]];
const HCOLORS=[["Silver","#C9CED6"],["Gold","#E4B43C"],["Black","#2B2B2B"],["White","#FFFFFF"],["Pink","#FF8FC7"],["Sky","#7CC6FE"],["Grape","#6A3FC8"],["Cherry","#E63946"]];
const STICKERS=["⭐","❤️","🌈","🦄","🌸","🦋","🐶","🐱","⚡","🍦","🌙","☀️","🍓","🎀","⚽","🏈","🐬","🌻","💎","👑"];
const FONTS=[["Pacifico","Fancy"],["Bungee","Blocky"],["Baloo 2","Bubbly"],["Permanent Marker","Marker"]];
const TOOLS=[["paint","🖌️","Paint"],["stain","🪵","Wood stain"],["pattern","🔷","Patterns"],["handles","🔘","Handles"],["stickers","⭐","Stickers"],["name","✏️","My name"]];
const PART_TOOLS=["paint","stain","pattern"];
const KEY="zep-toy-chest-v1";
const GAL_KEY="zep-toy-chest-gallery-v1";

function defaultParts(){return{top:{t:"stain",v:"natural",p:"none"},frame:{t:"paint",v:"#FAFAF7",p:"none"},drawer:{t:"paint",v:"#B69CFF",p:"none"},binL:{t:"paint",v:"#7CC6FE",p:"none"},binR:{t:"paint",v:"#FF8FC7",p:"none"},inside:{t:"paint",v:"#FAFAF7",p:"none"},lip:{t:"stain",v:"natural",p:"none"},kick:{t:"paint",v:"#1F2A44",p:"none"}}}
function defaults(){return{
  parts:defaultParts(),
  handle:{s:"bar",c:"#C9CED6"},
  name:{text:"",font:"Pacifico",color:"#FFFFFF",x:170,y:84,size:30},
  stickers:[],tool:"paint",part:"drawer",selSticker:null,nextId:1,loadedId:null,loadedName:""
}}
let S=defaults();
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);S=Object.assign(defaults(),d);S.parts=Object.assign(defaultParts(),d.parts||{});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* The parts of a design that get saved to the gallery */
function snapshotDesign(){return JSON.parse(JSON.stringify({parts:S.parts,handle:S.handle,name:S.name,stickers:S.stickers}))}
function normalizeDesign(d){
  d=d||{};
  const parts=defaultParts();
  for(const k in parts){if(d.parts&&d.parts[k])parts[k]=Object.assign(parts[k],d.parts[k])}
  return{parts,handle:Object.assign({s:"bar",c:"#C9CED6"},d.handle||{}),name:Object.assign(defaults().name,d.name||{}),stickers:Array.isArray(d.stickers)?d.stickers:[]};
}

function rgb(h){h=String(h).replace("#","");return[0,2,4].map(i=>parseInt(h.substr(i,2),16)||0)}
function hex(a){return"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("")}
function shade(h,amt){const c=rgb(h);return hex(c.map(v=>amt<0?v*(1+amt):v+(255-v)*amt))}
function lum(h){const[r,g,b]=rgb(h);return(0.299*r+0.587*g+0.114*b)/255}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const HEART="M10 16C4 11 2 8 5 5.5C7 4 9 5 10 6.5C11 5 13 4 15 5.5C18 8 16 11 10 16Z";
function starPath(cx,cy,R,r){let d="";for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;d+=(i?"L":"M")+(cx+rad*Math.cos(a)).toFixed(1)+" "+(cy+rad*Math.sin(a)).toFixed(1)}return d+"Z"}
function patternDef(id,kind,col){
  if(kind==="stripes")return`<pattern id="${id}" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="${col}"/></pattern>`;
  if(kind==="dots")return`<pattern id="${id}" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3.5" fill="${col}"/><circle cx="14" cy="14" r="3.5" fill="${col}"/></pattern>`;
  if(kind==="checks")return`<pattern id="${id}" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="${col}"/><rect x="10" y="10" width="10" height="10" fill="${col}"/></pattern>`;
  if(kind==="hearts")return`<pattern id="${id}" width="22" height="22" patternUnits="userSpaceOnUse"><path d="${HEART}" fill="${col}" transform="translate(1 1)"/></pattern>`;
  if(kind==="stars")return`<pattern id="${id}" width="24" height="24" patternUnits="userSpaceOnUse"><path d="${starPath(12,12,7,3)}" fill="${col}"/></pattern>`;
  return"";
}
const GEO={
  top:[[10,20,320,22,5]],frame:[[20,40,300,340,2]],drawer:[[26,46,288,128,5]],
  binL:[[40,204,117,84,8]],binR:[[183,204,117,84,8]],
  inside:[[32,190,133,102,1],[175,190,133,102,1],[32,302,133,78,1],[175,302,133,78,1]],
  lip:[[20,362,300,18,2]],kick:[[34,380,272,16,2]]
};

/* Draws any design. pfx keeps pattern ids unique when many chests are on one page. live adds the tap/drag hooks. */
function buildSvg(D,pfx,live,sel,opts){
  const base=pt=>{const p=D.parts[pt];return p.t==="stain"?(STAINS[p.v]||STAINS.natural)[1]:p.v};
  const fill=pt=>{const p=D.parts[pt];return p.t==="stain"?`url(#${pfx}g-${STAINS[p.v]?p.v:"natural"})`:p.v};
  const overlay=pt=>lum(base(pt))>0.6?"rgba(31,42,68,.28)":"rgba(255,255,255,.55)";
  const rects=(pt,extra)=>GEO[pt].map(([x,y,w,h,r])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" ${extra}/>`).join("");
  const part=pt=>{
    const p=D.parts[pt];
    let o=`<g ${live?`data-part="${pt}" style="cursor:pointer"`:""}>${rects(pt,`fill="${fill(pt)}" stroke="rgba(0,0,0,.2)" stroke-width="1"`)}`;
    if(p.p&&p.p!=="none")o+=rects(pt,`fill="url(#${pfx}p-${pt})" pointer-events="none"`);
    return o+"</g>";
  };
  const shoe=(x,y,rot,col)=>`<path d="M0 0h26q5 0 5-5v-2q0-3-5-4l-8-2-5-6h-13z" transform="translate(${x} ${y}) rotate(${rot})" fill="${col}" stroke="#44506A" stroke-width="1" pointer-events="none"/>`;
  let g="<defs>";
  for(const k in STAINS){const c=STAINS[k][1];g+=`<pattern id="${pfx}g-${k}" width="80" height="24" patternUnits="userSpaceOnUse"><rect width="80" height="24" fill="${c}"/><path d="M0 6Q20 2 40 6T80 6" stroke="${shade(c,-0.2)}" stroke-width="1.2" fill="none"/><path d="M0 16Q20 20 40 15T80 17" stroke="${shade(c,-0.13)}" stroke-width="0.9" fill="none"/></pattern>`}
  for(const pt in D.parts){const p=D.parts[pt];if(p.p&&p.p!=="none")g+=patternDef(pfx+"p-"+pt,p.p,overlay(pt))}
  g+="</defs>";
  g+=`<rect x="0" y="396" width="340" height="16" fill="${(opts&&opts.floor)||"var(--floor)"}"/>`;
  g+=part("frame")+part("inside");
  g+=`<rect x="20" y="180" width="300" height="10" fill="${fill("frame")}" pointer-events="none"/><rect x="20" y="292" width="300" height="10" fill="${fill("frame")}" pointer-events="none"/><rect x="165" y="190" width="10" height="190" fill="${fill("frame")}" pointer-events="none"/>`;
  g+=part("binL")+part("binR");
  g+=`<rect x="80.5" y="218" width="36" height="10" rx="5" fill="rgba(0,0,0,.3)" pointer-events="none"/><rect x="223.5" y="218" width="36" height="10" rx="5" fill="rgba(0,0,0,.3)" pointer-events="none"/>`;
  g+=shoe(44,370,0,"#FFFFFF")+shoe(82,368,-14,"#FFD6E0")+shoe(118,372,10,"#FFFFFF")+shoe(96,346,22,"#B5E8FF")+shoe(186,370,-16,"#FFE7A8")+shoe(226,370,8,"#FFFFFF")+shoe(262,372,0,"#FFD6E0");
  g+=part("lip")+part("kick")+part("drawer")+part("top");
  g+=`<g pointer-events="none">${handleSvg(D.handle)}</g>`;
  if(D.name.text.trim()){
    const n=D.name,stroke=lum(n.color)>0.6?"rgba(31,42,68,.55)":"rgba(255,255,255,.7)";
    g+=`<g ${live?`data-drag="name" style="cursor:grab"`:""} transform="translate(${n.x} ${n.y})"><text text-anchor="middle" dominant-baseline="central" font-family="'${esc(n.font)}', cursive" font-size="${n.size}" fill="${n.color}" stroke="${stroke}" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round">${esc(n.text)}</text></g>`;
  }
  for(const s of D.stickers){
    g+=`<g ${live?`data-drag="s" data-id="${s.id}" style="cursor:grab"`:""} transform="translate(${s.x} ${s.y})">${live&&sel&&sel.sticker===s.id?`<circle r="${s.s*0.72}" fill="none" stroke="#FFC93C" stroke-width="2.5" class="sel"/>`:""}<text text-anchor="middle" dominant-baseline="central" font-size="${s.s}">${esc(s.e)}</text></g>`;
  }
  if(live&&sel&&sel.part){
    const list=sel.part==="all"?["frame","top"]:[sel.part];
    g+=list.map(pt=>GEO[pt].map(([x,y,w,h,r])=>`<rect class="sel" x="${x-2}" y="${y-2}" width="${w+4}" height="${h+4}" rx="${r+2}" fill="none" stroke="#FFC93C" stroke-width="3" pointer-events="none"/>`).join("")).join("");
  }
  return g;
}
function handleSvg(H){
  const c=H.c,st=shade(c,-0.35),cx=170,cy=128,a=`fill="${c}" stroke="${st}" stroke-width="1.5"`;
  switch(H.s){
    case"knobs":return`<circle cx="118" cy="${cy}" r="9" ${a}/><circle cx="222" cy="${cy}" r="9" ${a}/>`;
    case"star":return`<path d="${starPath(cx,cy,17,7.5)}" ${a} stroke-linejoin="round"/>`;
    case"heart":return`<path d="${HEART}" transform="translate(${cx-19} ${cy-20}) scale(1.9)" fill="${c}" stroke="${st}" stroke-width="0.8"/>`;
    case"flower":{let s="";for(let i=0;i<5;i++){const ang=-Math.PI/2+i*2*Math.PI/5;s+=`<circle cx="${(cx+10*Math.cos(ang)).toFixed(1)}" cy="${(cy+10*Math.sin(ang)).toFixed(1)}" r="7.5" ${a}/>`}return s+`<circle cx="${cx}" cy="${cy}" r="6" fill="${shade(c,-0.2)}"/>`}
    default:return`<rect x="128" y="${cy-6}" width="84" height="12" rx="6" ${a}/>`;
  }
}
const svg=document.getElementById("chest");
function render(){
  svg.innerHTML=buildSvg(S,"m-",true,{part:PART_TOOLS.includes(S.tool)?S.part:null,sticker:S.selSticker});
}

const toolsEl=document.getElementById("tools"),optsEl=document.getElementById("options");
function renderTools(){toolsEl.innerHTML=TOOLS.map(([k,e,l])=>`<button class="tool" data-tool="${k}" aria-pressed="${S.tool===k}"><span aria-hidden="true">${e}</span>${l}</button>`).join("")}
function partChips(){return`<h2>Which part?</h2><div class="chips">${PARTS.map(([k,l])=>`<button class="chip" data-part="${k}" aria-pressed="${S.part===k}">${l}</button>`).join("")}</div>`}
function cur(){return S.part==="all"?S.parts.drawer:S.parts[S.part]}
function renderOptions(){
  let h="";const c=cur();
  if(S.tool==="paint"){
    h=partChips()+`<h2>Pick a paint color</h2><div class="swatches">${PAINT.map(([n,v])=>`<button class="sw" data-paint="${v}" aria-pressed="${c.t==="paint"&&c.v===v}" aria-label="${n} paint"><span class="dot" style="background:${v}"></span>${n}</button>`).join("")}</div>`;
  }else if(S.tool==="stain"){
    h=partChips()+`<h2>Pick a wood stain</h2><div class="swatches">${Object.entries(STAINS).map(([k,[n,v]])=>`<button class="sw" data-stain="${k}" aria-pressed="${c.t==="stain"&&c.v===k}" aria-label="${n} stain"><span class="dot" style="background:repeating-linear-gradient(8deg,${v} 0 7px,${shade(v,-0.15)} 7px 9px)"></span>${n}</button>`).join("")}</div><p class="note">Stain lets the wood grain show through the color.</p>`;
  }else if(S.tool==="pattern"){
    h=partChips()+`<h2>Add a pattern</h2><div class="opts">${PATTERNS.map(([k,l])=>`<button class="opt" data-pattern="${k}" aria-pressed="${(c.p||"none")===k}"><svg width="54" height="40" viewBox="0 0 54 40" aria-hidden="true"><defs>${patternDef("mini-"+k,k,"rgba(255,255,255,.75)")}</defs><rect width="54" height="40" rx="8" fill="#B69CFF"/>${k!=="none"?`<rect width="54" height="40" rx="8" fill="url(#mini-${k})"/>`:""}</svg>${l}</button>`).join("")}</div><p class="note">Patterns go on top of the paint or stain you picked.</p>`;
  }else if(S.tool==="handles"){
    h=`<h2>Drawer handle shape</h2><div class="opts">${HSTYLES.map(([k,l])=>`<button class="opt" data-hstyle="${k}" aria-pressed="${S.handle.s===k}">${miniHandle(k)}${l}</button>`).join("")}</div><h2>Handle color</h2><div class="swatches">${HCOLORS.map(([n,v])=>`<button class="sw" data-hcolor="${v}" aria-pressed="${S.handle.c===v}" aria-label="${n} handle"><span class="dot" style="background:${v}"></span>${n}</button>`).join("")}</div>`;
  }else if(S.tool==="stickers"){
    h=`<h2>Tap a sticker to add it</h2><div class="tray">${STICKERS.map(e=>`<button class="st" data-sticker="${e}" aria-label="Add sticker ${e}">${e}</button>`).join("")}</div>`;
    if(S.selSticker!=null&&S.stickers.some(s=>s.id===S.selSticker)){
      h+=`<h2>Your picked sticker</h2><div class="row"><button class="big" data-act="bigger">Bigger</button><button class="big" data-act="smaller">Smaller</button><button class="big" data-act="remove">Remove it</button></div>`;
    }else h+=`<p class="note">Tap a sticker on the chest to make it bigger, smaller, or remove it.</p>`;
    if(S.stickers.length)h+=`<div class="row"><button class="big" data-act="clearstickers">Remove all stickers</button></div>`;
  }else if(S.tool==="name"){
    h=`<h2>What should it say?</h2><input type="text" id="nameInput" maxlength="14" value="${esc(S.name.text)}" aria-label="Name on the chest"><h2>Letter style</h2><div class="opts">${FONTS.map(([f,l])=>`<button class="opt" data-font="${f}" aria-pressed="${S.name.font===f}"><span style="font-family:'${f}',cursive;font-size:22px;line-height:1.4">Zep</span>${l}</button>`).join("")}</div><h2>Letter color</h2><div class="swatches">${PAINT.map(([n,v])=>`<button class="sw" data-ncolor="${v}" aria-pressed="${S.name.color===v}" aria-label="${n} letters"><span class="dot" style="background:${v}"></span>${n}</button>`).join("")}</div><div class="row"><button class="big" data-act="nbigger">Bigger letters</button><button class="big" data-act="nsmaller">Smaller letters</button></div>`;
  }
  optsEl.innerHTML=h;
}
function miniHandle(k){
  const c="#C9CED6",st="#7C838D",a=`fill="${c}" stroke="${st}" stroke-width="1.5"`;
  let inner;
  if(k==="knobs")inner=`<circle cx="14" cy="18" r="6" ${a}/><circle cx="46" cy="18" r="6" ${a}/>`;
  else if(k==="star")inner=`<path d="${starPath(30,18,12,5)}" ${a}/>`;
  else if(k==="heart")inner=`<path d="${HEART}" transform="translate(17 5) scale(1.3)" ${a}/>`;
  else if(k==="flower"){inner="";for(let i=0;i<5;i++){const g=-Math.PI/2+i*2*Math.PI/5;inner+=`<circle cx="${(30+7*Math.cos(g)).toFixed(1)}" cy="${(18+7*Math.sin(g)).toFixed(1)}" r="5" ${a}/>`}}
  else inner=`<rect x="6" y="13" width="48" height="10" rx="5" ${a}/>`;
  return`<svg width="60" height="36" viewBox="0 0 60 36" aria-hidden="true">${inner}</svg>`;
}
function targets(){return S.part==="all"?Object.keys(S.parts):[S.part]}
function update(){save();render();renderTools();renderOptions()}

toolsEl.addEventListener("click",e=>{const b=e.target.closest("[data-tool]");if(!b)return;S.tool=b.dataset.tool;if(S.tool!=="stickers")S.selSticker=null;update()});
optsEl.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.part){S.part=d.part}
  else if(d.paint){targets().forEach(t=>{S.parts[t].t="paint";S.parts[t].v=d.paint})}
  else if(d.stain){targets().forEach(t=>{S.parts[t].t="stain";S.parts[t].v=d.stain})}
  else if(d.pattern){targets().forEach(t=>{S.parts[t].p=d.pattern})}
  else if(d.hstyle){S.handle.s=d.hstyle}
  else if(d.hcolor){S.handle.c=d.hcolor}
  else if(d.sticker){const id=S.nextId++;S.stickers.push({id,e:d.sticker,x:110+Math.random()*120,y:70+Math.random()*80,s:34});S.selSticker=id}
  else if(d.font){S.name.font=d.font}
  else if(d.ncolor){S.name.color=d.ncolor}
  else if(d.act){
    const s=S.stickers.find(x=>x.id===S.selSticker);
    if(d.act==="bigger"&&s)s.s=Math.min(80,s.s+6);
    if(d.act==="smaller"&&s)s.s=Math.max(16,s.s-6);
    if(d.act==="remove"&&s){S.stickers=S.stickers.filter(x=>x!==s);S.selSticker=null}
    if(d.act==="clearstickers"){S.stickers=[];S.selSticker=null}
    if(d.act==="nbigger")S.name.size=Math.min(56,S.name.size+4);
    if(d.act==="nsmaller")S.name.size=Math.max(14,S.name.size-4);
  }
  update();
});
optsEl.addEventListener("input",e=>{if(e.target.id==="nameInput"){S.name.text=e.target.value;save();render()}});

let drag=null;
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener("pointerdown",e=>{
  const d=e.target.closest("[data-drag]");
  if(d){
    const p=pt(e);let obj;
    if(d.dataset.drag==="name"){obj=S.name}else{const id=+d.dataset.id;obj=S.stickers.find(s=>s.id===id);S.selSticker=id;if(S.tool!=="stickers")S.tool="stickers";render();renderTools();renderOptions()}
    const el=d.dataset.drag==="name"?svg.querySelector('[data-drag="name"]'):svg.querySelector(`[data-id="${d.dataset.id}"]`);
    drag={obj,el,dx:p.x-obj.x,dy:p.y-obj.y};
    svg.setPointerCapture(e.pointerId);e.preventDefault();return;
  }
  const part=e.target.closest("[data-part]");
  if(part){S.part=part.dataset.part;if(!PART_TOOLS.includes(S.tool))S.tool="paint";S.selSticker=null;update()}
});
svg.addEventListener("pointermove",e=>{
  if(!drag)return;const p=pt(e);
  drag.obj.x=Math.max(10,Math.min(330,p.x-drag.dx));drag.obj.y=Math.max(10,Math.min(400,p.y-drag.dy));
  if(drag.el)drag.el.setAttribute("transform",`translate(${drag.obj.x} ${drag.obj.y})`);
});
function endDrag(){if(drag){drag=null;save()}}
svg.addEventListener("pointerup",endDrag);svg.addEventListener("pointercancel",endDrag);

/* ---------- Messages ---------- */
const msgEl=document.getElementById("msg");let msgTimer=null;
function say(text,err){msgEl.textContent=text;msgEl.className="msg"+(err?" err":"");clearTimeout(msgTimer);if(!err)msgTimer=setTimeout(()=>{msgEl.textContent=""},4000)}

/* ---------- Saved designs store ----------
   Designs live in Dad's Google Drive (through a small Apps Script web app), so every
   device sees the same list and each save also drops a picture into the Drive folder.
   If Drive can't be reached, designs save on this device and move to Drive the next
   time it connects. */
const DRIVE_URL="https://script.google.com/macros/s/AKfycbxMuKZUJlJ6zLnp1E6CBBULu-Z2VGR_S3j2yBFX6jHXPONkl96MzGJd1rMPnIVDpYfw/exec";
const DRIVE_KEY="tcs-NZVw1ZMnkXuCEZClUhzisZiR";
const driveOn=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(DRIVE_URL);
const store={mode:"local",remote:[],list:[],loading:driveOn,lastSync:0,syncing:false,warned:false};

function readLocalGallery(){try{const r=localStorage.getItem(GAL_KEY);const a=r?JSON.parse(r):[];return Array.isArray(a)?a:[]}catch(e){return[]}}
function writeLocalGallery(a){try{localStorage.setItem(GAL_KEY,JSON.stringify(a));return true}catch(e){return false}}
function newId(){return"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function saveLocal(id,name,createdAt,design){
  const a=readLocalGallery(),i=a.findIndex(x=>x.id===id);
  const row={id,name,createdAt,updatedAt:Date.now(),design};
  if(i>=0)a[i]=row;else a.push(row);
  if(!writeLocalGallery(a))throw{code:"local_full"};
}
function removeLocal(id){const a=readLocalGallery();if(a.some(x=>x.id===id))writeLocalGallery(a.filter(x=>x.id!==id))}
function upsertRemote(row){const i=store.remote.findIndex(x=>x.id===row.id);if(i>=0)store.remote[i]=row;else store.remote.push(row)}
/* A design waiting on this device wins over an older Drive copy with the same id. */
function rebuildList(){
  const local=readLocalGallery(),localIds=new Set(local.map(r=>r.id));
  const pending=local.map(r=>Object.assign({},r,{pending:driveOn}));
  store.list=store.remote.filter(r=>!localIds.has(r.id)).concat(pending).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  renderGallery();
}

/* Talking to the Drive script. Plain-text POST keeps the browser from blocking it. */
async function driveGet(){
  const r=await fetch(`${DRIVE_URL}?key=${encodeURIComponent(DRIVE_KEY)}&t=${Date.now()}`);
  const j=await r.json();if(!j.ok)throw{code:j.error||"drive"};
  return Array.isArray(j.designs)?j.designs:[];
}
async function drivePost(body){
  const r=await fetch(DRIVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:DRIVE_KEY},body))});
  const j=await r.json();if(!j.ok)throw{code:j.error||"drive"};
  return j;
}

/* Picture of the chest for Drive. Fonts are fetched for just the letters used and tucked
   into the picture, since a saved image can't load web fonts on its own. */
const fontCache={};
function blobToDataUrl(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)})}
async function fontFace(family,text){
  const key=family+"|"+text;if(key in fontCache)return fontCache[key];
  let face="";
  try{
    const css=await(await fetch(`https://fonts.googleapis.com/css2?family=${family.replace(/ /g,"+")}&text=${encodeURIComponent(text)}`)).text();
    const m=css.match(/url\((https:[^)]+)\)/);
    if(m){const data=await blobToDataUrl(await(await fetch(m[1])).blob());face=`@font-face{font-family:'${family}';src:url(${data});}`}
  }catch(e){face=""}
  return fontCache[key]=face;
}
async function exportPng(design,label){
  const D=normalizeDesign(design);
  const faces=[];
  if(D.name.text.trim())faces.push(await fontFace(D.name.font,D.name.text));
  if(label)faces.push(await fontFace("Baloo 2",label));
  const svgStr=`<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 340 450"><style>${faces.join("")}</style><rect width="340" height="450" fill="#DCE6FF"/>${buildSvg(D,"x-",false,null,{floor:"#D9C4A2"})}${label?`<text x="170" y="434" text-anchor="middle" font-family="'Baloo 2', 'Trebuchet MS', sans-serif" font-size="20" fill="#1F2A44">${esc(label)}</text>`:""}</svg>`;
  const url=URL.createObjectURL(new Blob([svgStr],{type:"image/svg+xml"}));
  try{
    const img=new Image();img.src=url;await img.decode();
    const c=document.createElement("canvas");c.width=680;c.height=900;
    c.getContext("2d").drawImage(img,0,0,680,900);
    return c.toDataURL("image/png");
  }finally{URL.revokeObjectURL(url)}
}

/* Returns where it landed: "drive" or "device". */
async function saveDesign(id,name){
  const existing=id?store.list.find(x=>x.id===id):null;
  const design=snapshotDesign();
  const createdAt=existing?existing.createdAt:Date.now();
  const useId=id||newId();
  if(driveOn&&store.mode==="drive"){
    try{
      let png="";try{png=await exportPng(design,name)}catch(e){png=""}
      const j=await drivePost({action:"save",id:useId,name,createdAt,design,png});
      upsertRemote(j.row);removeLocal(j.row.id);rebuildList();
      return{id:j.row.id,where:"drive"};
    }catch(e){
      if(e&&(e.code==="too_big"||e.code==="full"||e.code==="bad_key"))throw e;
      /* Couldn't reach Drive: keep it here and move it later. */
    }
  }
  saveLocal(useId,name,createdAt,design);rebuildList();
  return{id:useId,where:driveOn?"device":"local"};
}
async function deleteDesign(id){
  const isLocal=readLocalGallery().some(x=>x.id===id);
  const isRemote=store.remote.some(x=>x.id===id);
  if(isRemote){await drivePost({action:"delete",id});store.remote=store.remote.filter(x=>x.id!==id)}
  if(isLocal)removeLocal(id);
  rebuildList();
}
/* Move designs saved on this device up to Drive. Stops quietly at the first problem. */
async function syncPending(){
  if(store.syncing)return;store.syncing=true;
  try{
    for(const r of readLocalGallery()){
      let png="";try{png=await exportPng(r.design,r.name)}catch(e){png=""}
      const j=await drivePost({action:"save",id:r.id,name:r.name,createdAt:r.createdAt,design:r.design,png});
      upsertRemote(j.row);removeLocal(r.id);rebuildList();
    }
  }catch(e){}finally{store.syncing=false}
}
async function loadDrive(){
  if(!driveOn)return;
  store.lastSync=Date.now();
  try{
    store.remote=await driveGet();store.mode="drive";store.loading=false;rebuildList();
    if(readLocalGallery().length){await syncPending();if(!readLocalGallery().length)say("Your designs from this device are now in the design box.")}
  }catch(e){
    store.loading=false;rebuildList();
    if(!store.warned){store.warned=true;say("Can't reach the design box right now. New designs will save on this device until it's back.",true)}
  }
}
function saveErrorText(e){
  const c=e&&e.code;
  if(c==="full")return"The design box is full. Ask Dad to clean out a few old designs.";
  if(c==="too_big")return"That design has too much on it to save. Try removing a few stickers.";
  if(c==="bad_key")return"The design box isn't set up right. Ask Dad to check it.";
  if(c==="local_full")return"This device is out of room for designs. Delete a few, then save again.";
  return"That didn't save. Try the save button again.";
}

/* ---------- Gallery ---------- */
const cardsEl=document.getElementById("cards"),galCount=document.getElementById("galCount");
const armedDeletes=new Map();
function fmtDate(ms){if(!ms)return"";try{return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}catch(e){return""}}
function renderGallery(){
  const n=store.list.length;
  galCount.textContent=n?`${n} design${n===1?"":"s"}`:"";
  if(!n){cardsEl.innerHTML=`<div class="empty">${store.loading?"Loading saved designs...":"No saved designs yet. Make one you love, then tap Save design."}</div>`;return}
  cardsEl.innerHTML=`<div class="cards">${store.list.map((r,i)=>{
    const D=normalizeDesign(r.design);
    const armed=armedDeletes.has(r.id);
    return`<div class="card${S.loadedId===r.id?" current":""}">
      <button class="thumb" data-open="${esc(r.id)}" aria-label="Open ${esc(r.name||"design")}"><svg viewBox="0 0 340 412" aria-hidden="true">${buildSvg(D,"t"+i+"-",false)}</svg></button>
      <div class="cname">${esc(r.name||"Untitled")}</div>
      <div class="cdate">${fmtDate(r.updatedAt||r.createdAt)}</div>${r.pending?`<div class="cdate pend">Only on this device for now</div>`:""}
      <div class="cbtns"><button class="open" data-open="${esc(r.id)}">Open</button><button class="del${armed?" armed":""}" data-del="${esc(r.id)}">${armed?"Sure?":"Delete"}</button></div>
    </div>`}).join("")}</div>`;
}
cardsEl.addEventListener("click",async e=>{
  const o=e.target.closest("[data-open]");
  if(o){
    const r=store.list.find(x=>x.id===o.dataset.open);if(!r)return;
    const D=normalizeDesign(r.design);
    S.parts=D.parts;S.handle=D.handle;S.name=D.name;S.stickers=D.stickers;
    S.nextId=Math.max(1,...S.stickers.map(s=>(+s.id||0)+1));
    S.selSticker=null;S.loadedId=r.id;S.loadedName=r.name||"";
    closeSaveBar();update();renderGallery();
    say(`Opened "${r.name||"Untitled"}".`);
    window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
    return;
  }
  const d=e.target.closest("[data-del]");
  if(d){
    const id=d.dataset.del;
    if(!armedDeletes.has(id)){
      armedDeletes.set(id,setTimeout(()=>{armedDeletes.delete(id);renderGallery()},3000));renderGallery();return;
    }
    clearTimeout(armedDeletes.get(id));armedDeletes.delete(id);
    const r=store.list.find(x=>x.id===id);
    try{await deleteDesign(id);if(S.loadedId===id){S.loadedId=null;S.loadedName="";save()}say(`Deleted "${(r&&r.name)||"Untitled"}".`)}
    catch(err){say("That didn't delete. Try again.",true)}
    renderGallery();
  }
});

/* ---------- Save bar ---------- */
const saveBar=document.getElementById("savebar"),saveName=document.getElementById("saveName"),saveNew=document.getElementById("saveNew"),saveUpdate=document.getElementById("saveUpdate");
function loadedStillExists(){return S.loadedId&&store.list.some(x=>x.id===S.loadedId)}
function openSaveBar(){
  const hasLoaded=loadedStillExists();
  saveName.value=`Design ${store.list.length+1}`;
  saveUpdate.hidden=!hasLoaded;
  saveUpdate.textContent=hasLoaded?`Save over "${S.loadedName||"Untitled"}"`:"Save over it";
  saveBar.classList.add("open");saveName.focus();saveName.select();
}
function closeSaveBar(){saveBar.classList.remove("open")}
let saving=false;
async function doSave(overwrite){
  if(saving)return;
  const name=overwrite?(S.loadedName||"Untitled"):(saveName.value.trim()||`Design ${store.list.length+1}`);
  saving=true;saveNew.disabled=saveUpdate.disabled=true;saveNew.textContent="Saving...";
  try{
    const res=await saveDesign(overwrite?S.loadedId:null,name);
    S.loadedId=res.id;S.loadedName=name;save();
    closeSaveBar();
    if(res.where==="device")say(`Saved "${name}" on this device. It'll move to the design box once it connects again.`);
    else say(overwrite?`Saved changes to "${name}".`:`Saved "${name}"! It's in My saved designs on every device.`);
    renderGallery();
  }catch(err){say(saveErrorText(err),true)}
  finally{saving=false;saveNew.disabled=saveUpdate.disabled=false;saveNew.textContent="Save as new"}
}
document.getElementById("saveOpen").addEventListener("click",()=>saveBar.classList.contains("open")?closeSaveBar():openSaveBar());
document.getElementById("saveCancel").addEventListener("click",closeSaveBar);
saveNew.addEventListener("click",()=>doSave(false));
saveUpdate.addEventListener("click",()=>doSave(true));
saveName.addEventListener("keydown",e=>{if(e.key==="Enter")doSave(false);if(e.key==="Escape")closeSaveBar()});

/* ---------- Header buttons ---------- */
const resetBtn=document.getElementById("reset");let resetArmed=null;
resetBtn.addEventListener("click",()=>{
  if(resetArmed){clearTimeout(resetArmed);resetArmed=null;resetBtn.textContent="Start over";S=defaults();update();renderGallery();say("Fresh chest! Your saved designs are still safe below.");return}
  resetBtn.textContent="Tap again to erase";
  resetArmed=setTimeout(()=>{resetArmed=null;resetBtn.textContent="Start over"},3000);
});
document.getElementById("surprise").addEventListener("click",()=>{
  const r=a=>a[Math.floor(Math.random()*a.length)];
  for(const k in S.parts){
    if(Math.random()<0.3){S.parts[k].t="stain";S.parts[k].v=r(Object.keys(STAINS))}else{S.parts[k].t="paint";S.parts[k].v=r(PAINT)[1]}
    S.parts[k].p=Math.random()<0.25?r(PATTERNS.slice(1))[0]:"none";
  }
  S.handle={s:r(HSTYLES)[0],c:r(HCOLORS)[1]};
  S.name.font=r(FONTS)[0];S.name.color=r(PAINT)[1];
  update();
});

/* ---------- Start up ---------- */
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{render();renderGallery()});
update();
rebuildList();
loadDrive();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-store.lastSync>10000)loadDrive()});
</script>
</body>
</html>
